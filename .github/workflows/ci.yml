name: Stage 1 CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: loan_platform_test
          MYSQL_USER: loan_test
          MYSQL_PASSWORD: loan_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://loan_test:loan_test_password@127.0.0.1:3306/loan_platform_test
      JWT_ISSUER: https://issuer.example.test
      JWT_AUDIENCE: loan-platform-test
      JWT_PUBLIC_KEY_PEM: test-placeholder-not-used-by-db-checks
      CORS_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm run test:static
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:mysql
