name: Stage 1 CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: loan_platform_test
          MYSQL_USER: loan_test
          MYSQL_PASSWORD: loan_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://loan_test:loan_test_password@127.0.0.1:3306/loan_platform_test
      JWT_ISSUER: https://issuer.example.test
      JWT_AUDIENCE: loan-platform-test
      JWT_PUBLIC_KEY_PEM: test-placeholder-not-used-by-db-checks
      CORS_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Verify API starts without administrator JWT settings
        shell: bash
        run: |
          set -euo pipefail
          env -u JWT_ISSUER -u JWT_AUDIENCE -u JWT_PUBLIC_KEY_PEM PORT=3101 HOST=127.0.0.1 node dist/server.js > /tmp/loan-api-startup.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:3101/health; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/loan-api-startup.log
              exit 1
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/loan-api-startup.log
              exit 1
            fi
            sleep 1
          done
          admin_status=$(curl --silent --output /tmp/loan-admin-auth-response.json --write-out '%{http_code}' -H 'Authorization: Bearer startup-smoke-test' -X POST http://127.0.0.1:3101/api/v1/admin/loan-products)
          test "$admin_status" = "503"
          grep -q "Administrator authentication is not configured" /tmp/loan-api-startup.log || true
      - run: npm test
      - run: npm run test:static
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:mysql
