name: Portal CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "apps/portal/**"
      - ".github/workflows/portal-ci.yml"

permissions:
  contents: read

jobs:
  portal-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build frontend
        run: npm run build
      - name: Run customer portal interaction tests
        run: npm test
      - name: Build the Blitz deployment image
        run: docker build --pull -f ../../Dockerfile -t loan-portal-preview:ci ../..
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser checks
        run: npm run test:e2e
      - name: Upload browser QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-portal-browser-qa
          path: |
            apps/portal/test-results/
            apps/portal/playwright-report/
          if-no-files-found: ignore
