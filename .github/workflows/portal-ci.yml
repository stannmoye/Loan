name: Portal CI

on:
  push:
    branches:
      - feat/customer-operations-portal-shell
  pull_request:
    branches: [main]
    paths:
      - "apps/portal/**"
      - ".github/workflows/portal-ci.yml"

permissions:
  contents: read

jobs:
  portal-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/portal/package.json
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build frontend
        run: npm run build
